<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<title>Kuli-Klicker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --glow: #2f6bff; --bg1: #141a3d; --bg2: #05060f; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg2); color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #bg { position: fixed; inset: 0; background:
      radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--glow) 38%, transparent) 0, transparent 42%),
      radial-gradient(ellipse at 50% 0%, var(--bg1), var(--bg2) 75%); transition: background .6s; }
  #pen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 26px; white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: up 1s ease-out forwards; }
  .float.auto { font-size: 17px; opacity: .8; color: #b9d0ff; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
                  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -260%) scale(1); } }
  .ring { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid var(--glow);
    animation: ring .45s ease-out forwards; }
  @keyframes ring { to { transform: scale(4); opacity: 0; } }

  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 18px) 16px 0; text-align: center; pointer-events: none; }
  #count { font-size: clamp(40px, 12vw, 64px); font-weight: 900; letter-spacing: -1px; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
  #label { font-size: 15px; font-weight: 700; opacity: .85; margin-top: 4px; }
  #cps { font-size: 13px; opacity: .65; margin-top: 4px; }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translateX(-50%); pointer-events: none;
    background: rgba(0,0,0,.45); border: 1px solid var(--line); padding: 8px 14px; border-radius: 99px; font-size: 13px; width: max-content; max-width: 92vw; text-align: center; transition: opacity .5s; }
  #hint.gone { opacity: 0; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 14px calc(env(safe-area-inset-bottom) + 14px); z-index: 5; }
  .tabbtn { flex: 1; border: 1px solid var(--line); background: rgba(15,18,40,.75); backdrop-filter: blur(10px); color: #fff; border-radius: 16px;
    padding: 13px 8px; font-size: 16px; font-weight: 700; }
  .tabbtn.small { flex: 0 0 56px; }
  .tabbtn.active { background: color-mix(in srgb, var(--glow) 65%, #000); border-color: transparent; color: #fff; }

  #sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 58%; z-index: 4; background: rgba(12,14,32,.94); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
  #sheet.open { transform: none; }
  #sheetHead { display: flex; align-items: center; padding: 14px 18px 8px; }
  #sheetTitle { flex: 1; font-size: 19px; font-weight: 800; }
  #sheetClose { background: var(--card); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
  #list { overflow-y: auto; padding: 4px 14px 14px; touch-action: pan-y; flex: 1; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
  .item, .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    color: #fff; border-radius: 14px; padding: 10px 12px; font: inherit; }
  .item .ic { font-size: 30px; width: 40px; text-align: center; }
  .item .tx { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .item small, .skin small { opacity: .65; font-size: 12px; }
  .item .pr { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
  .item.cant, .skin.cant { opacity: .45; }
  .opt { justify-content: space-between; padding: 14px; font-size: 15px; }
  .skin { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--card); border: 2px solid transparent; color: #fff;
    border-radius: 14px; padding: 10px 6px; font: inherit; font-size: 13px; }
  .skin.on { border-color: var(--glow); }
  .skin .sw { width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.15); }
  .skin:not(.owned) .sw { filter: saturate(.5) brightness(.75); }
  .info, .locked, .stats { grid-column: 1 / -1; font-size: 13px; opacity: .75; padding: 4px 2px 6px; line-height: 1.6; }
  .stats { background: var(--card); border-radius: 14px; padding: 12px 14px; opacity: .9; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  #toast { position: fixed; top: calc(env(safe-area-inset-top) + 140px); left: 50%; transform: translate(-50%, -20px); opacity: 0; z-index: 9;
    background: rgba(255,255,255,.95); color: #111; font-weight: 700; padding: 10px 16px; border-radius: 14px; max-width: 88vw; text-align: center;
    transition: all .3s; pointer-events: none; font-size: 14px; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #err { position: fixed; inset: 40% 10% auto; text-align: center; background: #300; padding: 16px; border-radius: 12px; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="pen"></canvas>
<div id="fx"></div>
<div id="top">
  <div id="count">0</div>
  <div id="label">Klicks</div>
  <div id="cps">0 pro Sek.</div>
</div>
<div id="hint">👆 Tippen = Klicken · ✋ Halten &amp; Ziehen = Drehen</div>
<div id="toast"></div>
<div id="sheet">
  <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Schließen">✕</button></div>
  <div id="list"></div>
</div>
<div id="bar">
  <button class="tabbtn" data-tab="up">⚡ Upgrades</button>
  <button class="tabbtn" data-tab="skins">🎨 Skins</button>
  <button class="tabbtn small" data-tab="menu" aria-label="Einstellungen">⚙️</button>
</div>
<div id="err" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
